<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ประวัติการซื้อ-ขาย - Campus Marketplace</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .profile-card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }
        .history-section {
            margin-bottom: 30px;
        }
        .history-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .history-card.buy {
            border-left: 5px solid #27ae60;
        }
        .history-card.sell {
            border-left: 5px solid #2980b9;
        }
        .badge-buyer {
            background: #e8f8f5;
            color: #27ae60;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.85rem;
        }
        .badge-seller {
            background: #ebf5fb;
            color: #2980b9;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>Campus Marketplace</h1>
        <nav>
            <a href="index.html">หน้าแรก</a>
            <a href="checkout.html">ตะกร้าสินค้า</a>
            <a href="profile.html"><strong>ประวัติการซื้อ-ขาย</strong></a>
            <a href="chat.html">Live Chat</a>
        </nav>
    </header>

    <div class="container" style="max-width: 800px; margin-top: 20px;">
        <!-- ส่วนแสดงข้อมูลโปรไฟล์ -->
        <div class="profile-card">
            <h2>👤 ข้อมูลผู้ใช้งาน</h2>
            <p style="margin-top: 10px;"><strong>ชื่อผู้ใช้งาน:</strong> <span id="profName">-</span></p>
            <p><strong>อีเมล:</strong> <span id="profEmail">-</span></p>
            <p><strong>User ID:</strong> <span id="profId" style="font-family: monospace; color: #7f8c8d;">-</span></p>
        </div>

        <!-- ส่วนที่ 1: ประวัติการสั่งซื้อ (ในฐานะผู้ซื้อ) -->
        <div class="history-section">
            <h2>🛒 ประวัติการสั่งซื้อ (สินค้าที่เราซื้อ)</h2>
            <div id="myOrdersList" style="margin-top: 15px;">กำลังโหลดข้อมูลการซื้อ...</div>
        </div>

        <!-- ส่วนที่ 2: ประวัติรายการขาย (ในฐานะผู้ขาย) -->
        <div class="history-section">
            <h2>🏷️ ประวัติรายการขาย (สินค้าที่เราขาย)</h2>
            <div id="mySalesList" style="margin-top: 15px;">กำลังโหลดข้อมูลการขาย...</div>
        </div>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem('user')) || { user_id: 'guest', name: 'นักศึกษา', email: '-' };

        function displayProfile() {
            document.getElementById('profName').innerText = user.name || 'นักศึกษา';
            document.getElementById('profEmail').innerText = user.email || '-';
            document.getElementById('profId').innerText = user.user_id || 'guest';
        }

        // 1. โหลดประวัติการสั่งซื้อ (เรา = ผู้ซื้อ)
        async function loadMyOrders() {
            const container = document.getElementById('myOrdersList');
            try {
                const res = await fetch(`/api/my-orders/${user.user_id}`);
                const orders = await res.json();

                if (orders.length === 0) {
                    container.innerHTML = '<p style="color: #777;">ยังไม่มีประวัติการซื้อสินค้า</p>';
                    return;
                }

                container.innerHTML = orders.map(o => `
                    <div class="history-card buy">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                            <div>
                                <span class="badge-buyer">👤 ผู้ซื้อ: ${o.buyer_name || user.name}</span>
                                <span style="font-size: 0.8rem; color: #7f8c8d; margin-left: 8px;">Order ID: ${o.order_id}</span>
                            </div>
                            <span style="font-size: 0.8rem; color: #7f8c8d;">${new Date(o.createdAt).toLocaleString('th-TH')}</span>
                        </div>

                        <p style="margin: 8px 0 5px 0;"><strong>รายการสินค้า:</strong></p>
                        <ul style="margin-left: 20px; margin-bottom: 10px;">
                            ${(o.items || []).map(item => `
                                <li>
                                    <strong>${item.title}</strong> - ${item.price} บาท 
                                    <span class="badge-seller" style="margin-left: 6px;">🏪 ผู้ขาย: ${item.seller_name || 'นักศึกษา (ผู้ขาย)'}</span>
                                </li>
                            `).join('')}
                        </ul>

                        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px; border-top: 1px solid #eee; padding-top: 8px;">
                            <span style="color: #27ae60; font-weight: bold; font-size: 1.05rem;">ยอดจ่ายรวม: ${o.totalPrice} บาท</span>
                            <button onclick="window.location.href='checkout.html'" style="background: #2980b9; padding: 5px 12px; font-size: 0.8rem;">
                                🧾 ดูใบเสร็จ
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error(err);
                container.innerHTML = '<p style="color: red;">เกิดข้อผิดพลาดในการโหลดประวัติการซื้อ</p>';
            }
        }

        // 2. โหลดประวัติรายการขาย (เรา = ผู้ขาย)
        async function loadMySales() {
            const container = document.getElementById('mySalesList');
            try {
                const res = await fetch(`/api/my-sales/${user.user_id}`);
                const sales = await res.json();

                if (sales.length === 0) {
                    container.innerHTML = '<p style="color: #777;">ยังไม่มีประวัติการขายสินค้า</p>';
                    return;
                }

                container.innerHTML = sales.map(s => `
                    <div class="history-card sell">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                            <div>
                                <span class="badge-seller">🏪 ผู้ขาย: ${user.name}</span>
                                <span style="font-size: 0.8rem; color: #7f8c8d; margin-left: 8px;">Order ID: ${s.order_id}</span>
                            </div>
                            <span style="font-size: 0.8rem; color: #7f8c8d;">${new Date(s.createdAt).toLocaleString('th-TH')}</span>
                        </div>

                        <p style="margin: 8px 0 5px 0;"><strong>ขายให้แก่:</strong> <span class="badge-buyer">👤 ผู้ซื้อ: ${s.buyer_name}</span></p>

                        <p style="margin: 8px 0 5px 0;"><strong>สินค้าที่ขายได้:</strong></p>
                        <ul style="margin-left: 20px; margin-bottom: 10px;">
                            ${(s.soldItems || []).map(item => `
                                <li><strong>${item.title}</strong> - ${item.price} บาท</li>
                            `).join('')}
                        </ul>

                        <div style="border-top: 1px solid #eee; padding-top: 8px; text-align: right;">
                            <span style="color: #2980b9; font-weight: bold; font-size: 1.05rem;">รายรับรวม: ${s.totalSoldPrice} บาท</span>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error(err);
                container.innerHTML = '<p style="color: red;">เกิดข้อผิดพลาดในการโหลดประวัติรายการขาย</p>';
            }
        }

        displayProfile();
        loadMyOrders();
        loadMySales();
    </script>
</body>
</html>
